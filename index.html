<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Meta Tags for SEO -->
    <meta
      name="description"
      content="OmniCraft provides an extensive library of resources, designs, icons, and UI components to inspire your next project."
    />
    <meta
      name="keywords"
      content="OmniCraft, UI Libraries, Web Development, Design Resources, Icons, Templates"
    />
    <meta name="author" content="Fahad Shahbaz" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph Tags for Social Media -->
    <meta
      property="og:title"
      content="OmniCraft - Your Ultimate Resource Hub for Designs and UI Components"
    />
    <meta
      property="og:description"
      content="Explore a vast collection of resources, ready-to-use templates, and inspiration for your next project."
    />
    <meta property="og:image" content="/OmniCraft/public/og-image.jpg" />
    <meta property="og:url" content="https://omnicraft.vercel.app" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card for better sharing on Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OmniCraft" />
    <meta
      name="twitter:description"
      content="Discover designs, UI libraries, icons, and more to craft visually appealing websites and applications."
    />
    <meta name="twitter:image" content="/OmniCraft/public/twitter-card.jpg" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/OmniCraft/public/favicon.ico"
    />

    <title>OmniCraft</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
